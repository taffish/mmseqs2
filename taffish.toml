[package]
name = "mmseqs2"
kind = "tool"
version = "19"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/mmseqs2"

[command]
name = "taf-mmseqs2"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/mmseqs2:19-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64,linux/arm64"

[meta]
domain = "bio"
categories = ["sequence-search", "sequence-clustering", "taxonomy", "protein", "nucleotide"]
keywords = ["mmseqs2", "mmseqs", "sequence-search", "sequence-clustering", "easy-search", "easy-cluster", "taxonomy", "metagenomics", "protein", "nucleotide"]
description = "CPU sequence search, clustering and taxonomy with native offline HTML and optional verified shared resources."

[upstream]
name = "MMseqs2"
type = "github"
repo = "soedinglab/MMseqs2"
homepage = "https://github.com/soedinglab/MMseqs2"
release_url = "https://github.com/soedinglab/MMseqs2/releases/tag/19-ab57c"
downloads = "https://codeload.github.com/soedinglab/MMseqs2/tar.gz/ab57c0b9cd8893f1063e391c94cc845a3179bab1; https://github.com/soedinglab/MMseqs2/releases/download/19-ab57c/mmseqs-linux-arm64.tar.gz"
version = "19-ab57c"
license = "MIT"
citation = "Steinegger and Soeding 2017; Steinegger and Soeding 2018; Mirdita et al. 2019; Mirdita et al. 2021; Kallenborn et al. 2025"
doi = "10.1038/nbt.3988; 10.1038/s41467-018-04964-5; 10.1093/bioinformatics/bty1057; 10.1093/bioinformatics/btab184; 10.1038/s41592-025-02819-8"
watch = "tags"

[smoke]
backend = "docker"
timeout = 300
exist = ["mmseqs", "mmseqs2-db", "python3", "bash", "gawk", "grep", "curl", "wget", "xargs", "tar", "gzip", "bzip2", "xz"]
test = ["python3 /opt/mmseqs2/smoke.py meta", "python3 /opt/mmseqs2/smoke.py database", "python3 /opt/mmseqs2/smoke.py search", "python3 /opt/mmseqs2/smoke.py clustering", "python3 /opt/mmseqs2/smoke.py html", "python3 /opt/mmseqs2/smoke.py taxonomy", "python3 /opt/mmseqs2/smoke.py resources"]
