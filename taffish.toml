[package]
name = "mmseqs2"
kind = "tool"
version = "18"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[meta]
domain = "bio"
categories = ["sequence-search", "sequence-clustering", "taxonomy", "protein", "nucleotide"]
keywords = ["mmseqs2", "mmseqs", "sequence-search", "sequence-clustering", "easy-search", "easy-cluster", "taxonomy", "metagenomics", "protein", "nucleotide"]
description = "Ultra-fast sequence search, clustering, and taxonomy workflows for protein and nucleotide datasets."

[repository]
url = "https://github.com/taffish/mmseqs2"

[command]
name = "taf-mmseqs2"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/mmseqs2:18-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64,linux/arm64"

[upstream]
name = "MMseqs2"
type = "github"
repo = "soedinglab/MMseqs2"
homepage = "https://github.com/soedinglab/MMseqs2"
release_url = "https://github.com/soedinglab/MMseqs2/releases/tag/18-8cc5c"
downloads = "https://github.com/soedinglab/MMseqs2/releases/download/18-8cc5c/mmseqs-linux-sse2.tar.gz; https://github.com/soedinglab/MMseqs2/releases/download/18-8cc5c/mmseqs-linux-sse41.tar.gz; https://github.com/soedinglab/MMseqs2/releases/download/18-8cc5c/mmseqs-linux-avx2.tar.gz; https://github.com/soedinglab/MMseqs2/releases/download/18-8cc5c/mmseqs-linux-arm64.tar.gz"
version = "18-8cc5c"
license = "MIT"
citation = "Steinegger and Soeding 2017; Steinegger and Soeding 2018; Mirdita et al. 2019; Mirdita et al. 2021; Kallenborn et al. 2024"
doi = "10.1038/nbt.3988; 10.1038/s41467-018-04964-5; 10.1093/bioinformatics/bty1057; 10.1093/bioinformatics/btab184; 10.1101/2024.11.13.623350"
watch = "tags"

[smoke]
backend = "docker"
timeout = 300
exist = ["mmseqs", "bash", "gawk", "grep", "curl", "wget", "aria2c", "tar", "gzip", "bzip2"]
test = ["mmseqs version | grep -Fx '8cc5ce367b5638c4306c2d7cfc652dd099a4643f' >/dev/null", "mmseqs 2>&1 | grep -F 'MMseqs2 Version: 8cc5ce367b5638c4306c2d7cfc652dd099a4643f' >/dev/null", "mmseqs easy-search 2>&1 | grep -F 'usage: mmseqs easy-search' >/dev/null", "mmseqs createdb 2>&1 | grep -F 'usage: mmseqs createdb' >/dev/null", "mmseqs databases 2>&1 | grep -F 'usage: mmseqs databases' >/dev/null", "for module in easy-taxonomy fwbw pairaln taxonomyreport createdmptaxonomy; do mmseqs \"$module\" 2>&1 | grep -F \"usage: mmseqs $module\" >/dev/null || exit 1; done", "bash -lc 'printf ok' | grep -Fx ok >/dev/null", "mkdir -p /tmp/taf-mmseqs2-createdb && cd /tmp/taf-mmseqs2-createdb && printf '>s1\\nMKTAYIAKQRQISFVKSHFSRQLEERLGLIEVQANN\\n' > seqs.fa && gzip -c seqs.fa > seqs.fa.gz && bzip2 -c seqs.fa > seqs.fa.bz2 && mmseqs createdb seqs.fa.gz seqdb --threads 1 >/tmp/taf-mmseqs2-createdb.log 2>&1 && test -s seqdb && test -s seqdb.index && mmseqs createdb seqs.fa.bz2 seqdb_bz --threads 1 >/tmp/taf-mmseqs2-createdb-bz.log 2>&1 && test -s seqdb_bz && test -s seqdb_bz.index", "mkdir -p /tmp/taf-mmseqs2-search && cd /tmp/taf-mmseqs2-search && printf '>q1\\nMKTAYIAKQRQISFVKSHFSRQLEERLGLIEVQANN\\n' > query.fa && printf '>t1\\nMKTAYIAKQRQISFVKSHFSRQLEERLGLIEVQANN\\n>t2\\nGILGFVFTLTVPSERKELKQLLQK\\n' > target.fa && mmseqs easy-search query.fa target.fa result.m8 tmp --threads 1 -s 1.0 >/tmp/taf-mmseqs2-easy-search.log 2>&1 && test -s result.m8 && grep -F 'q1' result.m8 >/dev/null && grep -F 't1' result.m8 >/dev/null", "mkdir -p /tmp/taf-mmseqs2-cluster && cd /tmp/taf-mmseqs2-cluster && printf '>s1\\nMKTAYIAKQRQISFVKSHFSRQLEERLGLIEVQANN\\n>s2\\nMKTAYIAKQRQISFVKSHFSRQLEERLGLIEVQANN\\n>s3\\nGILGFVFTLTVPSERKELKQLLQK\\n' > seqs.fa && mmseqs easy-cluster seqs.fa cluster tmp --threads 1 --min-seq-id 0.9 -c 0.8 >/tmp/taf-mmseqs2-cluster.log 2>&1 && test -s cluster_cluster.tsv && grep -F 's1' cluster_cluster.tsv >/dev/null && grep -F 's2' cluster_cluster.tsv >/dev/null", "mkdir -p /tmp/taf-mmseqs2-lin-rbh && cd /tmp/taf-mmseqs2-lin-rbh && printf '>q1\\nMKTAYIAKQRQISFVKSHFSRQLEERLGLIEVQANN\\n>q2\\nGILGFVFTLTVPSERKELKQLLQK\\n' > query.fa && printf '>t1\\nMKTAYIAKQRQISFVKSHFSRQLEERLGLIEVQANN\\n>t2\\nGILGFVFTLTVPSERKELKQLLQK\\n>t3\\nAAAAAAAAAAAAAAAAAAAAAAAAAAAA\\n' > target.fa && mmseqs easy-linclust target.fa lin tmp-lin --threads 1 --min-seq-id 0.9 -c 0.8 >/tmp/taf-mmseqs2-linclust.log 2>&1 && test -s lin_cluster.tsv && mmseqs easy-rbh query.fa target.fa rbh.m8 tmp-rbh --threads 1 -s 1.0 >/tmp/taf-mmseqs2-rbh.log 2>&1 && test -s rbh.m8 && grep -F 'q1' rbh.m8 >/dev/null", "mkdir -p /tmp/taf-mmseqs2-db-workflow && cd /tmp/taf-mmseqs2-db-workflow && printf '>q1\\nMKTAYIAKQRQISFVKSHFSRQLEERLGLIEVQANN\\n>q2\\nGILGFVFTLTVPSERKELKQLLQK\\n' > query.fa && printf '>t1\\nMKTAYIAKQRQISFVKSHFSRQLEERLGLIEVQANN\\n>t2\\nGILGFVFTLTVPSERKELKQLLQK\\n>t3\\nAAAAAAAAAAAAAAAAAAAAAAAAAAAA\\n' > target.fa && mmseqs createdb query.fa queryDB --threads 1 >/tmp/taf-mmseqs2-createdb-query.log 2>&1 && mmseqs createdb target.fa targetDB --threads 1 >/tmp/taf-mmseqs2-createdb-target.log 2>&1 && mmseqs search queryDB targetDB resultDB tmp-search --threads 1 -s 1.0 >/tmp/taf-mmseqs2-search-db.log 2>&1 && mmseqs convertalis queryDB targetDB resultDB result.m8 >/tmp/taf-mmseqs2-convertalis.log 2>&1 && test -s result.m8 && grep -F 'q1' result.m8 >/dev/null && mmseqs createtsv queryDB targetDB resultDB result.tsv >/tmp/taf-mmseqs2-createtsv.log 2>&1 && test -s result.tsv && mmseqs convert2fasta targetDB target.back.fa >/tmp/taf-mmseqs2-convert2fasta.log 2>&1 && test -s target.back.fa && grep -F '>t1' target.back.fa >/dev/null"]
